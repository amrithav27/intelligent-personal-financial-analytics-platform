worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Rate limiting (Increased for load testing)
    limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;

    # Nginx Proxy Caches
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=128m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dashboard_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Upstream backends
    upstream auth_backend         { server phoenix-auth:8001; }
    upstream ingestion_backend    { server phoenix-ingestion:8002; }
    upstream analytics_backend    { server phoenix-analytics:8003; }
    upstream anomaly_backend      { server phoenix-anomaly:8004; }
    upstream recommendation_backend { server phoenix-recommendation:8005; }
    upstream notification_backend { server phoenix-notification:8006; }
    upstream frontend_backend     { server phoenix-frontend:3000; }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Add CORS headers for development
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-User-ID' always;
        add_header 'Access-Control-Max-Age' '1728000' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # JWT validation sub-request
        location = /auth/validate {
            internal;
            proxy_pass http://auth_backend/internal/validate-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;

            proxy_cache auth_cache;
            proxy_cache_key "$http_authorization";
            proxy_cache_valid 200 5m;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
        }

        # Protected API routes
        location /api/v1/ {
            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            limit_req zone=api burst=5000 nodelay;

            # Public Auth routes
            location ~ ^/api/v1/auth/(register|login|refresh)$ {
                auth_request off;
                rewrite ^/api/v1/auth/(.*)$ /$1 break;
                proxy_pass http://auth_backend;
            }

            # Protected Auth routes (e.g. /me)
            location /api/v1/auth/ {
                proxy_pass http://auth_backend/;
            }

            # Transaction routes — match with or without trailing slash
            location ^~ /api/v1/transactions {
                client_max_body_size 10m;
                proxy_pass http://ingestion_backend/transactions;
            }

            # Analytics routes
            location ^~ /api/v1/analytics/ {
                proxy_pass http://analytics_backend/;
            }

            # Dashboard routes (served by analytics with Fault Tolerance caching)
            location ^~ /api/v1/dashboard/ {
                proxy_cache dashboard_cache;
                proxy_cache_key "$request_uri|$user_id";
                proxy_cache_valid 200 30s;
                proxy_ignore_headers Cache-Control Expires Set-Cookie;
                proxy_cache_use_stale error timeout http_502 http_503 http_504 updating;
                proxy_cache_background_update on;
                add_header X-Cache-Status $upstream_cache_status;
                
                proxy_pass http://analytics_backend/dashboard/;
            }

            # Alert routes
            location ^~ /api/v1/alerts {
                proxy_pass http://anomaly_backend/alerts;
            }

            # Recommendation routes
            location ^~ /api/v1/recommendations/ {
                proxy_pass http://recommendation_backend/recommendations/;
            }
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://notification_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
